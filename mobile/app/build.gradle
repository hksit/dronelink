plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The DJI App Key comes from the GitHub secret DJI_APP_KEY (or -PDJI_APP_KEY=...).
// It is tied to the package name com.hksit.dronelink.mobile. Never commit it.
def djiKey = (project.findProperty('DJI_APP_KEY') ?: System.getenv('DJI_APP_KEY') ?: '').toString().trim()

android {
    namespace 'com.hksit.dronelink.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hksit.dronelink.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders['DJI_API_KEY'] = djiKey ?: 'MISSING'
        buildConfigField 'boolean', 'HAS_DJI_KEY', djiKey ? 'true' : 'false'
        ndk {
            // DJI Mobile SDK v5 ships 64-bit ARM libraries only
            abiFilters 'arm64-v8a'
        }
    }

    // Test signing key (in the repo on purpose) so every test build installs over the last one.
    // Google Play builds will use Play App Signing with a separate, private upload key.
    signingConfigs {
        test {
            storeFile rootProject.file('test-signing.jks')
            storePassword 'dronelink-test'
            keyAlias 'dronelink'
            keyPassword 'dronelink-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    packaging {
        jniLibs {
            // the SDK loads its native libraries from disk
            useLegacyPackaging true
            pickFirsts.addAll(['lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so'])
            // same list as DJI's sample: these must not be stripped
            keepDebugSymbols.addAll([
                '*/*/libconstants.so', '*/*/libdji_innertools.so', '*/*/libdjibase.so', '*/*/libDJICSDKCommon.so',
                '*/*/libDJIFlySafeCore-CSDK.so', '*/*/libdjifs_jni-CSDK.so', '*/*/libDJIRegister.so', '*/*/libdjisdk_jni.so',
                '*/*/libDJIUpgradeCore.so', '*/*/libDJIUpgradeJNI.so', '*/*/libDJIWaypointV2Core-CSDK.so', '*/*/libdjiwpv2-CSDK.so',
                '*/*/libFlightRecordEngine.so', '*/*/libvideo-framing.so', '*/*/libwaes.so', '*/*/libagora-rtsa-sdk.so',
                '*/*/libc++.so', '*/*/libc++_shared.so', '*/*/libmrtc_28181.so', '*/*/libmrtc_agora.so', '*/*/libmrtc_core.so',
                '*/*/libmrtc_core_jni.so', '*/*/libmrtc_data.so', '*/*/libmrtc_log.so', '*/*/libmrtc_onvif.so',
                '*/*/libmrtc_rtmp.so', '*/*/libmrtc_rtsp.so'
            ])
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // DJI Mobile SDK v5
    implementation 'com.dji:dji-sdk-v5-aircraft:5.18.0'
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.18.0'
    runtimeOnly 'com.dji:dji-sdk-v5-networkImp:5.18.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // QR code scanner for the DroneLink address
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
