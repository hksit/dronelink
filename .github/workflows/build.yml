name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: Windows-installer
          - os: windows-latest
            script: dist:store     # Microsoft Store package (.appx), signed by the Store after upload
            name: Windows-Store-package
          - os: macos-14           # Apple Silicon (M1/M2/M3/M4)
            script: dist:mac
            name: Mac-Apple-Silicon
          - os: macos-15-intel     # Intel Macs
            script: dist:mac
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      # Mac: signing + notarization switch on automatically when these secrets exist.
      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: '[ -n "$APPLE_API_KEY_P8" ] && echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8" || echo "No Apple key: building unsigned"'

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log || {
            echo "::error title=Build failed::See the lines below"
            tail -n 40 build.log | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }
        env:
          # Mac (Apple Developer Program): Developer ID Application certificate as base64 .p12
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_P8 != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # No certificate yet -> build unsigned instead of failing
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: DroneLink-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.appx
            dist/*.dmg
