name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets a tagged build attach its files to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: Windows-installer
          - os: windows-latest
            script: dist:store     # Microsoft Store package (.appx), signed by the Store after upload
            name: Windows-Store-package
          - os: macos-14           # Apple Silicon (M1/M2/M3/M4)
            script: dist:mac
            name: Mac-Apple-Silicon
          - os: macos-15-intel     # Intel Macs
            script: dist:mac
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      # Mac: signing + notarization switch on automatically once the Apple secrets exist.
      # Without them the DMG is built unsigned.
      - name: Prepare Mac signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with Developer ID certificate"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No Apple certificate yet: building unsigned"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "Notarization enabled"
          fi

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log || {
            msg=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DroneLink-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.appx
            dist/*.dmg

      # On a version tag (v1.0.1 …) also attach the files to that GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "DroneLink ${GITHUB_REF_NAME#v}" --notes "Downloads for DroneLink ${GITHUB_REF_NAME#v}. Store package: DroneLink-*.appx. Windows installer: DroneLink-Setup-*.exe. Mac: DroneLink-*-arm64.dmg (Apple Silicon) and DroneLink-*-x64.dmg (Intel)." || true
          shopt -s nullglob
          for f in dist/*.exe dist/*.appx dist/*.dmg; do
            n=$(basename "$f" | tr ' ' '-')
            [ "$n" != "$(basename "$f")" ] && cp "$f" "dist/$n" && f="dist/$n"
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
